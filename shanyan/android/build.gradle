group 'com.shanyan'
version '1.0'

// 插件复用宿主锁定的 Android Gradle Plugin 和仓库，不引入旧 AGP 或已下线的 JCenter。

apply plugin: 'com.android.library'

android {
    namespace = "com.shanyan"

    // 当前 Flutter embedding 的 AndroidX 依赖要求 API 34+，与宿主保持 API 36；不提高 minSdk。
    compileSdk = 36

    defaultConfig {
        minSdk = 16
        consumerProguardFiles "consumer-rules.pro"
    }
    lint {
        checkReleaseBuilds = false
    }
}
dependencies {
    api files('libs/shanyan_sdk_v2.3.7.7_flutter.jar')
}